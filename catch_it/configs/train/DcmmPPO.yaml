seed: ${..seed}
algo: PPO

network:
  mlp:
    units: [256, 128]
  separate_value_mlp: True
  # Internal policy limits; physical action scales are unchanged.
  log_std_min: -5.0
  log_std_max: 0.0  # exploration standard deviation <= 1
  raw_mean_soft_bound: 2.0  # tanh(2) ~= 0.964; penalize larger logits

ppo:
  name: ${resolve_default:Dcmm,${...experiment}}
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: ${resolve_default:1,${...num_envs}}
  reward_scale_value: 0.1
  clip_value_loss: False
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  # exp05: a fixed, smaller learning rate. With 'kl' the rate climbed to its cap and stayed there, and in the
  # larry-catch runs good policies were knocked off again (catch rate peaked early, then fell).
  learning_rate: 3e-4
  lr_schedule: fixed  # 'fixed' | 'linear' | 'kl' | 'cos'
  kl_threshold: 0.016  # with lr_schedule fixed: only the early stop (an update stops after an epoch with KL > 2x this)
  save_best_after: 500
  save_frequency: 125  # epochs between snapshots (125 x 8192 steps ~ 1M steps); candidates for validation
  grad_norm: 1.0
  entropy_coef: 0.0
  truncate_grads: True
  e_clip: 0.2
  # The action scales (m and rad per step) live in configs/env/DcmmCfg.py (action_scale)
  # exp05: bigger, steadier updates. 512 steps x 16 envs = 8192 steps (~200 throws) per update, was 1024 (~25).
  horizon_length: 512
  minibatch_size: 2048
  mini_epochs: 5
  critic_coef: 4
  clip_value: True
  bounds_loss_coef: 0.0001
  max_agent_steps: 25000000
  # Legacy weights-only checkpoints need their last logged global step supplied.
  resume_agent_steps: 0
  test_num_episodes: 100
  max_test_steps: 10000
